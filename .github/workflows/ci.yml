name: CI

on:
  push:
    branches: [ "ariane-main" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.0.12077973
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install NDK
        run: |
          # The download is occasionally truncated ("unknown archive"), so retry it
          for attempt in 1 2 3; do
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}" < <(yes) > /dev/null && break
            [ "$attempt" = 3 ] && exit 1
            echo "NDK install failed (attempt $attempt), retrying"
            rm -rf "$ANDROID_HOME/ndk/${NDK_VERSION}"
            sleep 10
          done
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      # Surround passthrough (AC-3/DTS/TrueHD) needs FFmpeg's encoders. They are built
      # once and cached until build-ffmpeg.sh changes; without them the app plays PCM.
      - name: Cache FFmpeg encoder libraries
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/jni/ptenc/ffmpeg
          key: ffmpeg-ptenc-${{ env.NDK_VERSION }}-${{ hashFiles('app/src/main/jni/ptenc/build-ffmpeg.sh') }}

      - name: Build FFmpeg encoders
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: app/src/main/jni/ptenc/build-ffmpeg.sh

      - name: Unit tests
        run: ./gradlew --no-daemon testNonRoot_gameDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleNonRoot_gameDebug

      # Catches release-only problems (R8 rules, release resources) before a tag is pushed.
      # Unsigned here: the release key only exists in the release workflow.
      - name: Build release APK
        run: ./gradlew --no-daemon assembleNonRoot_gameRelease

      - name: Check that the passthrough encoder was packaged
        run: unzip -l app/build/outputs/apk/nonRoot_game/debug/*arm64-v8a*.apk | grep -q libmoonlight-ptenc.so

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: artemis-debug-apks
          path: app/build/outputs/apk/nonRoot_game/debug/*.apk

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
