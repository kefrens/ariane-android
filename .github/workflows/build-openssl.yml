name: Build OpenSSL

# Rebuilds the prebuilt static OpenSSL libraries with the NDK when the build
# script changes, and uploads them as an artifact to commit into
# app/src/main/jni/moonlight-core/openssl/.
on:
  pull_request:
    paths:
      - app/src/main/jni/moonlight-core/build-openssl.sh
      - .github/workflows/build-openssl.yml
  workflow_dispatch:

jobs:
  build-openssl:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.0.12077973
      OPENSSL_TAG: openssl-3.5.9
    steps:
      - uses: actions/checkout@v4

      - name: Install NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Fetch OpenSSL
        run: git clone --depth 1 --branch "$OPENSSL_TAG" https://github.com/openssl/openssl.git "$RUNNER_TEMP/openssl-src"

      - name: Build
        working-directory: ${{ runner.temp }}/openssl-src
        run: OUTPUT_DIR="$RUNNER_TEMP/openssl-out" "$GITHUB_WORKSPACE/app/src/main/jni/moonlight-core/build-openssl.sh"

      - name: Upload libraries
        uses: actions/upload-artifact@v4
        with:
          name: openssl-android
          path: ${{ runner.temp }}/openssl-out/
